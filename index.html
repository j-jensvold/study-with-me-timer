```html
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study With Me</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #613b3f;
      color: #f8eee2;
      font-family: Arial, Helvetica, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      opacity: 1;
      transition: opacity 0.4s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    .start-screen {
      width: 100%;
      max-width: 850px;
      padding: 40px;
      text-align: center;
    }

    .welcome {
      font-size: 13px;
      letter-spacing: 6px;
      opacity: 0.6;
      margin-bottom: 28px;
    }

    .title {
      font-size: clamp(34px, 6vw, 64px);
      letter-spacing: clamp(5px, 1.2vw, 12px);
      font-weight: 500;
      margin: 0 0 28px;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0.75;
      margin-bottom: 52px;
    }

    .start-button {
      display: inline-block;

      border: 2px solid #f8eee2;
      background: #f8eee2;
      color: #613b3f;

      padding: 18px 65px;
      border-radius: 7px;

      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 4px;

      cursor: pointer;

      transition:
        transform 0.15s,
        background 0.2s,
        color 0.2s;
    }

    .start-button:hover {
      background: transparent;
      color: #f8eee2;
      transform: scale(1.04);
    }

    .start-button:focus {
      outline: 3px solid rgba(248, 238, 226, 0.45);
      outline-offset: 5px;
    }

    .start-button:active {
      transform: scale(0.98);
    }

    .session-info {
      margin-top: 42px;
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.55;
    }

    @media (max-width: 600px) {
      .start-screen {
        padding: 25px;
      }

      .subtitle {
        line-height: 1.8;
      }

      .start-button {
        padding: 16px 45px;
      }
    }
  </style>
</head>

<body>

  <main class="start-screen">

    <div class="welcome">
      WELCOME
    </div>

    <h1 class="title">
      STUDY WITH ME
    </h1>

    <div class="subtitle">
      FOCUS • REST • REPEAT
    </div>

    <button
      id="startButton"
      class="start-button"
      type="button"
      autofocus
    >
      START
    </button>

    <div class="session-info">
      50 MINUTES FOCUS
      &nbsp; • &nbsp;
      10 MINUTES BREAK
    </div>

  </main>

  <script>
    const startButton =
      document.getElementById("startButton");

    let starting = false;

    function startStudySession() {

      // Prevent multiple activations
      if (starting) {
        return;
      }

      starting = true;

      // Fade out the start screen
      document.body.classList.add("fade-out");

      // Open the timer in the same tab
      setTimeout(function() {

        window.location.href =
          "timer.html?autostart=true";

      }, 400);
    }

    // Clicking START
    startButton.addEventListener(
      "click",
      startStudySession
    );

    // Pressing Enter anywhere on the page
    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.repeat
        ) {

          event.preventDefault();

          startStudySession();
        }
      }
    );

  </script>

</body>
</html>
