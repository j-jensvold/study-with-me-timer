<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Study With Me Timer</title>


  <style>

    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;

      min-height: 100%;

      margin: 0;

    }


    body {

      min-height: 100vh;

      background:
        #613b3f;

      color:
        #f8eee2;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      opacity: 0;

      animation:
        pageFadeIn
        0.7s ease
        forwards;

    }


    /* =========================================================
       PAGE FADE IN
       ========================================================= */

    @keyframes pageFadeIn {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    /* =========================================================
       MAIN PAGE
       ========================================================= */

    .page {

      width: 100%;

      max-width: 1200px;

      padding:
        35px 25px 40px;

      text-align: center;

    }


    /* =========================================================
       TITLE
       ========================================================= */

    .title {

      font-size: 18px;

      letter-spacing: 7px;

      font-weight: 600;

      margin-bottom: 25px;

    }


    /* =========================================================
       CURRENT PHASE
       ========================================================= */

    .current-phase {

      min-height: 18px;

      margin-bottom: 28px;

      font-size: 11px;

      letter-spacing: 3px;

      opacity: 0.75;

    }


    /* =========================================================
       TWO TIMER LAYOUT
       ========================================================= */

    .timers {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(
            0,
            1fr
          )
        );

      gap: 65px;

      align-items: start;

    }


    /* =========================================================
       TIMER CARD
       ========================================================= */

    .timer-card {

      text-align: center;

      opacity: 0.38;

      transform:
        scale(0.99);

      transition:
        opacity 0.45s ease,
        transform 0.45s ease;

    }


    .timer-card.active {

      opacity: 1;

      transform:
        scale(1.015);

    }


    /* =========================================================
       TIMER TITLE
       ========================================================= */

    .timer-title {

      font-size: 18px;

      letter-spacing: 5px;

      margin-bottom: 18px;

      font-weight: 500;

    }


    /* =========================================================
       CIRCLE WRAPPER
       ========================================================= */

    .circle-wrapper {

      position: relative;

      width: 340px;

      height: 340px;

      margin: 0 auto;

    }


    /* =========================================================
       SVG
       ========================================================= */

    .circle-svg {

      width: 100%;

      height: 100%;

      display: block;

      overflow: visible;

    }


    /* =========================================================
       DOTTED BACKGROUND CIRCLE
       ========================================================= */

    .circle-background {

      fill: none;

      stroke:
        #f8eee2;

      stroke-width: 4;

      stroke-dasharray:
        1 8;

      opacity: 0.95;

    }


    /* =========================================================
       SOLID COUNTDOWN RING
       ========================================================= */

    .circle-progress {

      fill: none;

      stroke:
        #f8eee2;

      stroke-width: 18;

      stroke-linecap: butt;

      transition:
        stroke-dashoffset 0.2s linear;

    }


    /* =========================================================
       WORK / STUDY IMAGE
       ========================================================= */

    .center-image {

      position: absolute !important;

      top: 50% !important;

      left: 50% !important;

      width: 115px !important;

      height: 115px !important;

      transform:
        translate(
          -50%,
          -50%
        ) !important;

      object-fit:
        contain !important;

      display:
        block !important;

      z-index: 2;


      /*
        Turn black artwork white.

        Transparent areas remain transparent.
      */

      filter:
        brightness(0)
        invert(1);

    }


    /* =========================================================
       BREAK / MUG IMAGE
       
       Slightly larger than the work image.
       ========================================================= */

    .break-image {

      width: 130px !important;

      height: 130px !important;

      transform:
        translate(
          -50%,
          -50%
        ) !important;

    }


    /* =========================================================
       DIGITAL TIMER
       ========================================================= */

    .time {

      font-size:
        clamp(
          55px,
          7vw,
          92px
        );

      font-weight: 400;

      line-height: 1;

      margin-top: 25px;

      letter-spacing: -2px;

      font-variant-numeric:
        tabular-nums;

      white-space: nowrap;

    }


    /* =========================================================
       STATUS
       ========================================================= */

    .status {

      margin-top: 15px;

      font-size: 13px;

      letter-spacing: 1px;

      min-height: 18px;

      opacity: 0.8;

    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .footer {

      margin-top: 45px;

      font-size: 11px;

      letter-spacing: 5px;

      opacity: 0.5;

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 850px) {

      .timers {

        grid-template-columns:
          1fr;

        gap: 70px;

      }


      .circle-wrapper {

        width: 300px;

        height: 300px;

      }


      .time {

        font-size: 65px;

      }

    }


    /* =========================================================
       SMALL MOBILE
       ========================================================= */

    @media (max-width: 400px) {

      .circle-wrapper {

        width: 270px;

        height: 270px;

      }


      .time {

        font-size: 58px;

      }


      .center-image {

        width: 100px !important;

        height: 100px !important;

      }


      /*
        Mug remains slightly larger
        than the work image.
      */

      .break-image {

        width: 115px !important;

        height: 115px !important;

        transform:
          translate(
            -50%,
            -50%
          ) !important;

      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =====================================================
         TITLE
         ===================================================== -->

    <div class="title">
      STUDY WITH ME
    </div>


    <!-- =====================================================
         CURRENT PHASE
         ===================================================== -->

    <div
      id="currentPhase"
      class="current-phase"
    >
      READY — FOCUS SESSION
    </div>


    <!-- =====================================================
         BOTH TIMERS
         ===================================================== -->

    <div class="timers">


      <!-- ===================================================
           FOCUS TIMER
           =================================================== -->

      <section
        id="focusCard"
        class="timer-card active"
      >

        <div class="timer-title">
          FOCUS
        </div>


        <div
          class="circle-wrapper"
        >

          <svg
            class="circle-svg"
            viewBox="0 0 300 300"
          >

            <!-- dotted background -->

            <circle
              class="circle-background"
              cx="150"
              cy="150"
              r="124"
            />


            <!-- animated countdown -->

            <circle
              id="focusProgress"
              class="circle-progress"
              cx="150"
              cy="150"
              r="124"
            />

          </svg>


          <!-- WORK / STUDY IMAGE -->

          <img
            class="center-image"
            src="./Study-Image.png"
            alt="Focus image"
          >

        </div>


        <div
          id="focusTime"
          class="time"
        >
          50:00
        </div>


        <div
          id="focusStatus"
          class="status"
        >
          Ready to focus
        </div>


      </section>



      <!-- ===================================================
           BREAK TIMER
           =================================================== -->

      <section
        id="breakCard"
        class="timer-card"
      >

        <div class="timer-title">
          BREAK
        </div>


        <div
          class="circle-wrapper"
        >

          <svg
            class="circle-svg"
            viewBox="0 0 300 300"
          >

            <!-- dotted background -->

            <circle
              class="circle-background"
              cx="150"
              cy="150"
              r="124"
            />


            <!-- animated countdown -->

            <circle
              id="breakProgress"
              class="circle-progress"
              cx="150"
              cy="150"
              r="124"
            />

          </svg>


          <!-- BREAK / MUG IMAGE -->

          <img
            class="center-image break-image"
            src="./Mug.png"
            alt="Break image"
          >

        </div>


        <div
          id="breakTime"
          class="time"
        >
          10:00
        </div>


        <div
          id="breakStatus"
          class="status"
        >
          Ready for a break
        </div>


      </section>


    </div>


    <div class="footer">
      FOCUS • REST • REPEAT
    </div>


  </main>



  <script>


    /* =========================================================
       READ AUTOSTART
       ========================================================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const AUTO_START =
      params.get("autostart") === "true";



    /* =========================================================
       TIMER DATA
       ========================================================= */

    const timers = {

      focus: {

        total:
          50 * 60,

        remaining:
          50 * 60,

        deadline:
          null,

        interval:
          null,

        running:
          false,

        /*
          Keeps track of which countdown
          second has already made a sound.
        */

        lastWarningSecond:
          null

      },


      break: {

        total:
          10 * 60,

        remaining:
          10 * 60,

        deadline:
          null,

        interval:
          null,

        running:
          false,

        lastWarningSecond:
          null

      }

    };


    /*
      Current Pomodoro phase:

      Focus → Break → Focus → Break...
    */

    let activePhase =
      "focus";


    /*
      Short transition between phases.
    */

    let transitionTimeout =
      null;



    /* =========================================================
       CIRCLE CONFIGURATION
       ========================================================= */

    const radius =
      124;


    const circumference =
      2 * Math.PI * radius;



    function setupCircle(
      id
    ) {

      const circle =
        document.getElementById(id);


      circle.style.strokeDasharray =
        circumference;


      circle.style.strokeDashoffset =
        0;


      /*
        Start at 12 o'clock.
      */

      circle.style.transform =
        "rotate(-90deg)";


      circle.style.transformOrigin =
        "50% 50%";

    }


    setupCircle(
      "focusProgress"
    );


    setupCircle(
      "breakProgress"
    );



    /* =========================================================
       FORMAT TIME
       ========================================================= */

    function formatTime(
      seconds
    ) {

      const minutes =
        Math.floor(
          seconds / 60
        );


      const secs =
        seconds % 60;


      return (

        String(minutes)
          .padStart(
            2,
            "0"
          )

        +

        ":"

        +

        String(secs)
          .padStart(
            2,
            "0"
          )

      );

    }



    /* =========================================================
       ACTIVE PHASE DISPLAY
       ========================================================= */

    function updatePhaseDisplay() {

      const phase =
        document.getElementById(
          "currentPhase"
        );


      const focusCard =
        document.getElementById(
          "focusCard"
        );


      const breakCard =
        document.getElementById(
          "breakCard"
        );


      if (
        activePhase === "focus"
      ) {

        focusCard.className =
          "timer-card active";


        breakCard.className =
          "timer-card";


        if (
          timers.focus.running
        ) {

          phase.textContent =
            "FOCUS SESSION — STAY FOCUSED";

        }

        else {

          phase.textContent =
            "READY — FOCUS SESSION";

        }

      }


      else {

        focusCard.className =
          "timer-card";


        breakCard.className =
          "timer-card active";


        if (
          timers.break.running
        ) {

          phase.textContent =
            "BREAK — TAKE A REST";

        }

        else {

          phase.textContent =
            "READY — BREAK";

        }

      }

    }



    /* =========================================================
       RENDER TIMER
       ========================================================= */

    function renderTimer(
      name
    ) {

      const timer =
        timers[name];


      const display =
        document.getElementById(
          name + "Time"
        );


      const progress =
        document.getElementById(
          name + "Progress"
        );


      /*
        Digital time.
      */

      display.textContent =
        formatTime(
          timer.remaining
        );


      /*
        Calculate percentage remaining.
      */

      const percentage =

        timer.remaining /
        timer.total;


      /*
        Convert percentage into
        SVG stroke offset.
      */

      const offset =

        circumference *
        (
          1 -
          percentage
        );


      progress.style.strokeDashoffset =
        offset;

    }



    /* =========================================================
       RENDER EVERYTHING
       ========================================================= */

    function renderAll() {

      renderTimer(
        "focus"
      );


      renderTimer(
        "break"
      );


      updatePhaseDisplay();

    }



    /* =========================================================
       STOP TIMER
       ========================================================= */

    function stopTimer(
      name
    ) {

      const timer =
        timers[name];


      if (
        timer.interval !== null
      ) {

        clearInterval(
          timer.interval
        );

      }


      timer.interval =
        null;


      timer.running =
        false;


      timer.deadline =
        null;

    }



    /* =========================================================
       CANCEL TRANSITION
       ========================================================= */

    function cancelTransition() {

      if (
        transitionTimeout !== null
      ) {

        clearTimeout(
          transitionTimeout
        );


        transitionTimeout =
          null;

      }

    }



    /* =========================================================
       SHORT COUNTDOWN BEEP
       ========================================================= */

    function countdownBeep() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (
          !AudioContext
        ) {

          return;

        }


        const audioContext =
          new AudioContext();


        /*
          A browser may create the audio
          context in a suspended state.
        */

        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        /*
          Short warning tone.
        */

        oscillator.type =
          "sine";


        oscillator.frequency.value =
          900;


        /*
          Small volume envelope.
        */

        gain.gain.setValueAtTime(
          0.001,
          audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.12,
          audioContext.currentTime
          + 0.01
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime
          + 0.18
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime
          + 0.18
        );

      }


      catch (
        error
      ) {

        console.log(
          "Countdown sound unavailable."
        );

      }

    }



    /* =========================================================
       COMPLETION BEEP
       ========================================================= */

    function completionBeep() {

      try {

        const AudioContext =
          window.AudioContext ||
          window.webkitAudioContext;


        if (
          !AudioContext
        ) {

          return;

        }


        const audioContext =
          new AudioContext();


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.connect(
          gain
        );


        gain.connect(
          audioContext.destination
        );


        oscillator.type =
          "sine";


        oscillator.frequency.value =
          700;


        /*
          Longer completion tone.
        */

        gain.gain.setValueAtTime(
          0.001,
          audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.25,
          audioContext.currentTime
          + 0.02
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime
          + 0.8
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime
          + 0.8
        );

      }


      catch (
        error
      ) {

        console.log(
          "Completion sound unavailable."
        );

      }

    }



    /* =========================================================
       START TIMER
       ========================================================= */

    function startTimer(
      name
    ) {

      const timer =
        timers[name];


      /*
        Don't start an already running timer.
      */

      if (
        timer.running
      ) {

        return;

      }


      /*
        Don't start if timer is at zero.
      */

      if (
        timer.remaining <= 0
      ) {

        return;

      }


      /*
        Determine opposite phase.
      */

      const other =

        name === "focus"

          ? "break"

          : "focus";


      /*
        Only one timer can run.
      */

      if (
        timers[other].running
      ) {

        stopTimer(
          other
        );

      }


      /*
        Set active phase.
      */

      activePhase =
        name;


      /*
        Mark timer as running.
      */

      timer.running =
        true;


      /*
        Reset the warning sound tracker.

        This allows the timer to beep again
        when it reaches 5 seconds on its
        next cycle.
      */

      timer.lastWarningSecond =
        null;


      /*
        Calculate exact deadline.
      */

      timer.deadline =

        Date.now()

        +

        (
          timer.remaining *
          1000
        );


      /*
        Update status.
      */

      document.getElementById(
        name + "Status"
      ).textContent =

        name === "focus"

          ? "Stay focused"

          : "Enjoy your break";


      /*
        Check the timer every 200ms.
      */

      timer.interval =

        setInterval(

          function() {

            tick(
              name
            );

          },

          200

        );


      renderAll();

    }



    /* =========================================================
       TIMER TICK
       ========================================================= */

    function tick(
      name
    ) {

      const timer =
        timers[name];


      if (
        !timer.running
      ) {

        return;

      }


      /*
        Calculate accurate remaining
        time from the actual clock.
      */

      timer.remaining =

        Math.max(

          0,

          Math.ceil(

            (
              timer.deadline
              -
              Date.now()

            ) / 1000

          )

        );


      /*
        ========================================================
        LAST 5 SECOND WARNING
        ========================================================

        Play exactly one beep at:

        5
        4
        3
        2
        1
      */

      if (

        timer.remaining >= 1 &&

        timer.remaining <= 5 &&

        timer.remaining !==
          timer.lastWarningSecond

      ) {

        timer.lastWarningSecond =
          timer.remaining;


        countdownBeep();

      }


      /*
        ========================================================
        TIMER COMPLETE
        ========================================================
      */

      if (
        timer.remaining <= 0
      ) {

        completeTimer(
          name
        );

        return;

      }


      renderAll();

    }



    /* =========================================================
       COMPLETE TIMER
       ========================================================= */

    function completeTimer(
      name
    ) {

      /*
        Stop current timer.
      */

      stopTimer(
        name
      );


      /*
        Make display exactly 00:00.
      */

      timers[name].remaining =
        0;


      /*
        Update completion message.
      */

      document.getElementById(
        name + "Status"
      ).textContent =

        name === "focus"

          ? "Focus session complete!"

          : "Break complete!";


      renderAll();


      /*
        Longer completion sound.
      */

      completionBeep();


      /*
        Determine next phase.
      */

      const nextPhase =

        name === "focus"

          ? "break"

          : "focus";


      /*
        Brief pause at 00:00.
      */

      transitionTimeout =

        setTimeout(

          function() {

            transitionTimeout =
              null;


            /*
              Reset next timer.
            */

            timers[nextPhase].remaining =

              timers[nextPhase].total;


            /*
              Switch phase.
            */

            activePhase =
              nextPhase;


            /*
              Automatically start it.
            */

            startTimer(
              nextPhase
            );

          },

          900

        );

    }



    /* =========================================================
       INITIALIZE
       ========================================================= */

    renderAll();


    /*
      Start the Focus timer automatically
      when the Start screen sends:

      timer.html?autostart=true
    */

    if (
      AUTO_START
    ) {

      setTimeout(

        function() {

          startTimer(
            "focus"
          );

        },

        700

      );

    }

  </script>

</body>

</html>
